name: ACLClouds Auto Renew

on:
  workflow_dispatch:
  schedule:
    - cron: '50 0 * * *' # 每天 UTC 1：00 触发（北京时间 9：00），由脚本判断是否执行，四天一续

permissions:
  contents: write
  actions: write

concurrency:
  group: aclclouds-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📅 日期检查
        id: check
        run: |
          START="2026-09-29"
          TODAY=$(date -u +%F)
          start_sec=$(date -d "$START" +%s)
          today_sec=$(date -d "$TODAY" +%s)
          days=$(( (today_sec - start_sec) / 86400 ))
          echo "Days since $START: $days"
          if (( days % 4 == 0 )); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出仓库代码
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up NodeJS
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
            node-version: '22'

      # 登录会话缓存：run_id 作为 key 保证每次刷新，restore-keys 命中上一次
      - name: 登录会话缓存
        if: steps.check.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: auth.json
          key: acl-session-${{ github.run_id }}
          restore-keys: |
            acl-session-

      # 浏览器二进制缓存：省掉每次约 300MB 的 Chromium 下载
      - name: 浏览器二进制缓存
        if: steps.check.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Install System Dependencies
        if: steps.check.outputs.should_run == 'true'
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Unit tests
        if: steps.check.outputs.should_run == 'true'
        run: |
          node test_classify.mjs
          node test_cap_pow.mjs
          node repro-hidden-btn.mjs

      - name: Run Renew Script
        if: steps.check.outputs.should_run == 'true'
        env:
          ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          ACL_SERVER_ID: ${{ secrets.ACL_SERVER_ID }}
          ACL_BASE_URL: ${{ vars.ACL_BASE_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # PoW 求解并发度。GitHub runner 通常 4 vCPU，留一部分给浏览器。
          CAP_POW_WORKERS: '4'
        run: node renew.mjs

      # --- 新增的防暂停代码开始 ---
      - name: Commit time.txt to repo
        # if: success()
        if: steps.check.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 如果 time.txt 不存在，说明是第一次运行
          if [ ! -f time.txt ]; then
            echo "首次生成时间：$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          else
            echo "$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          fi
          
          git add time.txt
          
          # 如果有更改再提交
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:main
          fi
      # --- 新增的防暂停代码结束 ---

      # - name: 上传排查截图
      #   # if: always()
      #   if: steps.check.outputs.should_run == 'true'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: debug-screenshots
      #     path: "*.png"

      # 运行记录只保留本次一条（KEEP_RUNS=0）。放在最后，避免删掉自己。
      # 需要保留排查用的历史时，把 KEEP_RUNS 调大即可。
